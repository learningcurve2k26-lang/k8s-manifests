apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: elastic-system

resources:
  - ../../base

helmCharts:
  - name: eck-operator
    repo: https://helm.elastic.co
    version: 3.3.2
    releaseName: elastic-operator
    namespace: elastic-system
    valuesFile: values.yaml
    includeCRDs: true
