apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: eck-operator
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/name: eck-operator
    app.kubernetes.io/part-of: infrastructure
spec:
  project: default
  
  source:
    repoURL: https://github.com/learningcurve2k26-lang/k8s-manifests
    targetRevision: main
    path: elastic-search/overlays/staging
    plugin:
      name: argocd-vault-plugin-kustomize-helm

  destination:
    server: https://kubernetes.default.svc
    namespace: elastic-system

  syncPolicy:
    automated:
      prune: false
      selfHeal: false
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true

  ignoreDifferences:
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      jsonPointers:
        - /webhooks/0/clientConfig/caBundle
