apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: prometheus
  
resources:
  - ../../base
  - prometheus-config.yaml
  - nodeport-svc.yaml
  - httproute.yaml

helmCharts:
  - name: prometheus 
    namespace: prometheus
    releaseName: prometheus
    repo: https://prometheus-community.github.io/helm-charts
    valuesFile: values.yaml
    version: 29.2.0
